<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferienwohnung</title>

<style>
:root {
  --primary: #3a5f5f;        /* edles Grün-Grau */
  --primary-light: #4f7a7a;
  --bg: #f2f0eb;             /* warmes Beige */
  --card: #ffffff;
  --text: #1f1f1f;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 40px;
}

header {
  background: var(--primary);
  color: white;
  padding: 22px;
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.card {
  background: var(--card);
  margin: 18px;
  padding: 24px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
}

input {
  width: 100%;
  padding: 14px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
  background: #fafafa;
}

input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.1s ease;
}

button:hover {
  background: var(--primary-light);
}

button:active {
  transform: scale(0.98);
}

#content { display: none; }

.section-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 14px;
  border-left: 4px solid var(--primary);
  padding-left: 10px;
}

.iframe-wrapper {
  width: 100%;
  border-radius: 12px;
  overflow: visible;
}

iframe {
  width: 100%;
  border: none;
}

.calendar iframe { height: 500px; }
.form iframe { height: 1200px; }

label {
  font-size: 14px;
  margin-top: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

@media (min-width: 768px) {
  .app { max-width: 720px; }
}
</style>
</head>

<body>

<div class="app">

  <header>Ferienwohnung – Verwaltung</header>

  <!-- Login -->
  <div class="card login">
    <h3 style="margin-top:0;font-weight:600;">Zugang</h3>
    <p>Bitte Codewort eingeben, um den internen Bereich zu öffnen.</p>

    <input type="password" id="code" placeholder="Codewort">

    <label>
      <input type="checkbox" id="togglePw" onclick="togglePassword()">
      Codewort anzeigen
    </label>

    <button onclick="checkCode()">Weiter</button>
  </div>

  <!-- Content -->
  <div id="content">

    <div class="card calendar">
      <div class="section-title">Belegungskalender</div>
      <div class="iframe-wrapper">
        <iframe 
          src="https://calendar.google.com/calendar/embed?src=ce2be12e5a92c966753683f9ed07bda4e1ae3f60b9c15cd1586652b81121a46f%40group.calendar.google.com&ctz=Europe/Berlin"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="card form">
      <div class="section-title">Buchungsanfrage</div>
      <div class="iframe-wrapper">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLSc9gQQR4_FUBeG7uQBEVN7xhhKpj10Jpp42Ooo-EpMjaBTJDQ/viewform?usp=header"
          scrolling="auto">
        </iframe>
      </div>
    </div>

  </div>

</div>

<script>
function checkCode() {
  const input = document.getElementById("code").value.trim();
  const correct = "Gomera?Buchung!";

  if (input === correct) {
    document.querySelector(".login").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    alert("Falsches Codewort");
  }
}

function togglePassword() {
  const field = document.getElementById("code");
  field.type = field.type === "password" ? "text" : "password";
}
</script>

</body>
</html>
