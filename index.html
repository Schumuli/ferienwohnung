<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Ferienwohnung</title>
<style>
  body { font-family: Arial; max-width: 800px; margin: 20px auto; }
  #content { display: none; }
  input { padding: 8px; width: 200px; }
  button { padding: 8px 12px; margin-left: 10px; }
</style>
</head>
<body>

<h1>Familien-Ferienwohnung</h1>

<h3>Bitte Codewort eingeben</h3>
<input type="password" id="code">
<button onclick="checkCode()">OK</button>

<div id="content">
  <h2>Belegungskalender</h2>

  <!-- GOOGLE KALENDER EINBETTUNG -->
  <iframe 
    src="DEIN_GOOGLE_KALENDER_LINK"
    style="border: 0" width="100%" height="600" frameborder="0" scrolling="no">
  </iframe>

  <h2>Buchungsanfrage</h2>

  <!-- GOOGLE FORMULAR EINBETTUNG -->
  <iframe 
    src="DEIN_GOOGLE_FORMULAR_LINK"
    width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0">
  </iframe>
</div>

<script>
function checkCode() {
  const correct = "Gomera?Buchung!"; // <<< DEIN CODEWORT
  const input = document.getElementById("code").value;

  if (input === correct) {
    document.getElementById("content").style.display = "block";
  } else {
    alert("Falsches Codewort");
  }
}
</script>

</body>
</html>
