<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferienwohnung</title>

<style>
:root {
  --primary: #2a7fff;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #222;
  --radius: 16px;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

.app {
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
}

header {
  background: var(--primary);
  color: white;
  padding: 20px;
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.card {
  background: var(--card);
  margin: 16px;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: white;
  cursor: pointer;
}

button:active { transform: scale(0.98); }

#content { display: none; }

.section-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}

.iframe-wrapper {
  width: 100%;
  border-radius: 12px;
  overflow: visible; /* WICHTIG: Formular darf scrollen */
}

iframe {
  width: 100%;
  border: none;
}

.calendar iframe { height: 500px; }

/* Formular groß genug machen */
.form iframe { height: 1200px; }

@media (min-width: 768px) {
  .app { max-width: 700px; }
}
</style>
</head>

<body>

<div class="app">

  <header>🏡 Ferienwohnung</header>

  <!-- Login -->
  <div class="card login">
    <h3>🔒 Zugriff</h3>
    <p>Bitte Codewort eingeben</p>
    <input type="password" id="code" placeholder="Codewort">
    <button onclick="checkCode()">Freischalten</button>
  </div>

  <!-- Content -->
  <div id="content">

    <div class="card calendar">
      <div class="section-title">📅 Belegungskalender</div>
      <div class="iframe-wrapper">
        <iframe 
          src="https://calendar.google.com/calendar/embed?src=ce2be12e5a92c966753683f9ed07bda4e1ae3f60b9c15cd1586652b81121a46f%40group.calendar.google.com&ctz=Europe/Berlin"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="card form">
      <div class="section-title">✍️ Buchungsanfrage</div>
      <div class="iframe-wrapper">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLSc9gQQR4_FUBeG7uQBEVN7xhhKpj10Jpp42Ooo-EpMjaBTJDQ/viewform?usp=header"
          scrolling="auto">
        </iframe>
      </div>
    </div>

  </div>

</div>

<script>
function checkCode() {
  const input = document.getElementById("code").value.trim();

  const correct = "Gomera?Buchung!";

  if (input === correct) {
    document.querySelector(".login").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    alert("Falsches Codewort");
  }
}
</script>

</body>
</html>
