<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ferienwohnung</title>

<style>
:root {
  --primary: #2a7fff;
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #222;
  --radius: 16px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* App Container */
.app {
  max-width: 420px;
  margin: 0 auto;
  min-height: 100vh;
}

/* Header */
header {
  background: var(--primary);
  color: white;
  padding: 20px;
  font-size: 22px;
  font-weight: 600;
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

/* Card */
.card {
  background: var(--card);
  margin: 16px;
  padding: 20px;
  border-radius: var(--radius);
  box-shadow: 0 8px 20px rgba(0,0,0,0.06);
}

/* Login */
.login h3 {
  margin-top: 0;
}

input {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 12px;
  border: 1px solid #ddd;
  margin-top: 10px;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 14px;
  font-size: 16px;
  font-weight: 600;
  border: none;
  border-radius: 12px;
  background: var(--primary);
  color: white;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

#content {
  display: none;
}

/* Sections */
.section-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 12px;
}

/* iFrame Wrapper */
.iframe-wrapper {
  width: 100%;
  overflow: hidden;
  border-radius: 12px;
}

iframe {
  width: 100%;
  border: none;
}

/* Kalender größer */
.calendar iframe {
  height: 500px;
}

/* Formular */
.form iframe {
  height: 600px;
}

/* Desktop Bonus */
@media (min-width: 768px) {
  .app {
    max-width: 700px;
  }
}
</style>
</head>

          scrolling="no">
        </iframe>
      </div>
