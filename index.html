<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Belegung & Buchungsanfrage</title>

<style>
:root {
  --primary: #3a5f5f;
  --primary-light: #4f7a7a;
  --bg: #f2f0eb;
  --card: #ffffff;
  --text: #1f1f1f;
  --radius: 14px;
  --shadow: 0 8px 24px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: 40px;
}

header {
  background: var(--primary);
  color: white;
  padding: 22px;
  font-size: 20px;
  font-weight: 600;
  text-align: center;
  letter-spacing: 0.5px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
}

.card {
  background: var(--card);
  margin: 18px;
  padding: 24px;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
}

/* Passwortfeld mit Auge */
.pw-wrapper {
  position: relative;
  width: 100%;
}

.pw-wrapper input {
  width: 100%;
  padding: 14px;
  padding-right: 50px;
  font-size: 15px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
  background: #fafafa;
}

.pw-wrapper input:focus {
  outline: none;
  border-color: var(--primary);
  background: #fff;
}

.pw-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  padding: 8px;
  border-radius: 6px;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pw-toggle svg {
  pointer-events: none;
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 16px;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 10px;
  background: var(--primary);
  color: white;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.1s ease;
}

button:hover {
  background: var(--primary-light);
}

button:active {
  transform: scale(0.98);
}

#content { display: none; }

.section-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 14px;
  border-left: 4px solid var(--primary);
  padding-left: 10px;
}

.iframe-wrapper {
  width: 100%;
  border-radius: 12px;
  overflow: hidden; /* FIX 1: verhindert horizontales Scrollen */
}

iframe {
  width: 100%;
  border: none;
}

/* Mobile-optimierter Kalender */
.calendar iframe {
  height: 600px;
  border-radius: 12px;
}

/* Formular */
.form iframe {
  height: 1200px;
}

/* FIX 2: Soft-Scaling für sehr schmale Geräte */
@media (max-width: 380px) {
  .calendar iframe {
    transform: scale(0.92);
    transform-origin: top left;
    width: 108%;
    height: 650px;
  }
}

@media (min-width: 768px) {
  .app { max-width: 720px; }
}
</style>
</head>

<body>

<div class="app">

  <header>Ferienwohnung – Verwaltung</header>

  <!-- Login -->
  <div class="card login">
    <h3 style="margin-top:0;font-weight:600;">Zugang</h3>
    <p>Bitte Codewort eingeben, um den internen Bereich zu öffnen.</p>

    <div class="pw-wrapper">
      <input type="password" id="code" placeholder="Codewort">

      <span class="pw-toggle" onclick="togglePassword()">
        <!-- Auge offen -->
        <svg id="eye-open" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>

        <!-- Auge geschlossen -->
        <svg id="eye-closed" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.77 21.77 0 0 1 5.06-5.94"/>
          <path d="M1 1l22 22"/>
          <path d="M9.88 9.88A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88"/>
        </svg>
      </span>
    </div>

    <button onclick="checkCode()">Weiter</button>
  </div>

  <!-- Content -->
  <div id="content">

    <div class="card calendar">
      <div class="section-title">Belegungskalender</div>
      <div class="iframe-wrapper">

        <!-- FUNKTIONIERENDER, MOBILE-OPTIMIERTER KALENDER -->
        <iframe
          src="https://calendar.google.com/calendar/embed?height=600&wkst=1&ctz=Europe%2FBerlin&showPrint=0&showCalendars=0&showTz=0&showTabs=0&showTitle=0&bgcolor=%23f2f0eb&src=Y2UyYmUxMmU1YTkyYzk2Njc1MzY4M2Y5ZWQwN2JkYTRlMWFlM2Y2MGI5YzE1Y2QxNTg2NjUyYjgxMTIxYTQ2ZkBncm91cC5jYWxlbmRhci5nb29nbGUuY29t&color=%233a5f5f"
          style="border-width:0;"
          scrolling="no">
        </iframe>

      </div>
    </div>

    <div class="card form">
      <div class="section-title">Buchungsanfrage</div>
      <div class="iframe-wrapper">
        <iframe 
          src="https://docs.google.com/forms/d/e/1FAIpQLSc9gQQR4_FUBeG7uQBEVN7xhhKpj10Jpp42Ooo-EpMjaBTJDQ/viewform?usp=header"
          scrolling="auto">
        </iframe>
      </div>
    </div>

  </div>

</div>

<script>
function checkCode() {
  const input = document.getElementById("code").value.trim();
  const correct = "Gomera?Buchung!";

  if (input === correct) {
    document.querySelector(".login").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    alert("Falsches Codewort");
  }
}

function togglePassword() {
  const field = document.getElementById("code");
  const eyeOpen = document.getElementById("eye-open");
  const eyeClosed = document.getElementById("eye-closed");

  if (field.type === "password") {
    field.type = "text";
    eyeOpen.style.display = "none";
    eyeClosed.style.display = "block";
  } else {
    field.type = "password";
    eyeOpen.style.display = "block";
    eyeClosed.style.display = "none";
  }
}
</script>

</body>
</html>
